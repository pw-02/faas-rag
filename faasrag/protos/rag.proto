//python -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. rag.proto

syntax = "proto3";

package rag;

message RAGRequest {
  string query = 1;
  int32 k = 2;
  int32 max_tokens = 3;
  string query_class = 4; // optional hint ("short", "medium", "long")
}

message Trace {
  // Flexible timing breakdown (ALL IN SECONDS)
  // Typical keys:
  // embed_s, ann_s, docstore_s, total_retrieval_s,
  // prompt_s, decode_s, total_s, queue_s, e2e_s
  map<string, double> timings_s = 1;

  // Cache stats (per request)
  bool cache_used = 2;
  int32 cache_hits = 3;
  int32 cache_misses = 4;

  // Request metadata
  int32 k = 5;
  int32 prompt_tokens = 6;
  int32 output_tokens = 7;

  repeated string retrieved_doc_ids = 8;
}

message RAGResponse {
  string answer = 1;
  Trace trace = 2;
}

service RAGService {
  rpc Query(RAGRequest) returns (RAGResponse);
}
