/*
python -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. rag.proto
*/
syntax = "proto3";

package rag;

message RAGRequest {
  string query = 1;
}

message Trace {
  // Flexible timing breakdown (ALL IN SECONDS)
  // Typical keys:
  // embed_s, ann_s, docstore_s, total_retrieval_s,
  // prompt_s, decode_s, total_s, queue_s, e2e_s
  map<string, double> timings_s = 1;

  // Cache stats (per request)
  bool cache_used = 2;
  int32 cache_hits = 3;
  int32 cache_misses = 4;

  // Request metadata
  int32 k = 5;
  int32 prompt_tokens = 6;
  int32 completion_tokens = 7;
  int32 total_tokens = 8;

  repeated string retrieved_doc_ids = 9;
}

message RAGResponse {
  string answer = 1;
  Trace trace = 2;
}

message PingRequest {}

message PingResponse {
  bool ok = 1;
  uint32 queue_depth = 2;
  uint32 max_inflight = 3;
}


service RAGService {
  rpc Query(RAGRequest) returns (RAGResponse);
  rpc Ping(PingRequest) returns (PingResponse);

}
