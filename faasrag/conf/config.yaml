defaults:
  - generator: llama3_8b_instruct #qwen2_5_instruct, llama3_8b_instruct, synthetic
  - embedder: dpr
  - index: wiki_faiss_hnsw_21m
  - docstore: wiki_dpr_21m #wiki_dpr_100k
  - cache: null #proximity,  _null_
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

host: localhost
port: 50051
num_workers: 1
max_inflight: 1
log_level: INFO
artifact_dir: artifacts
seed: 42

#retrieval
docstore_backend: s3_jsonl_offsets # local_sqlite, local_jsonl_offsets, s3_jsonl_offsets, memory_jsonl
top_k: 5 #k=0 => no retrieval, pure generation
retrieve_only: False
prompt_build_method: QA_OPEN #QA_STRICT, QA_OPEN, LLM_ONLY
max_ctx_chars: 4000

telemetry:
  enabled: true
  interval_s: 3
  dir: logs
  

hydra:
  run:
    dir: .
  sweep:
    dir: .
  output_subdir: null



