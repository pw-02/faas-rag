defaults:
  - generator: qwen2_5_instruct #qwen2_5_instruct, llama3_8b_instruct, synthetic
  - embedder: dpr
  - index: wiki_faiss_hnsw_100k
  - docstore: wiki_dpr_100k
  - cache: null #proximity,  _null_
  - _self_

host: localhost
port: 50051
top_k: 5 #k=0 => no retrieval, pure generation
num_workers: 1
max_inflight: 100
retrieve_only: false
device: null
log_level: INFO
artifact_dir: artifacts
seed: 42
prompt_type: rag_open   # "llm_only", "rag_strict", "rag_open"
# docstore_backend: sqlite # sqlite, jsonl_offsets, memory
max_ctx_chars: 4000
telemetry:
  enabled: true
  interval_s: 3
  path: resource_usage.jsonl



hydra:
  run:
    dir: .
  sweep:
    dir: .
  output_subdir: null
  job_logging:
    level: DISABLE
  hydra_logging:
    level: DISABLE
