AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DPR question embedding (ONNX Runtime) on Lambda container
Globals:
  Function:
    Timeout: 60
    MemorySize: 4096
    Architectures:
    - x86_64
    Environment:
      Variables:
        MAX_LENGTH: '509'
        MODEL_FILE: model.onnx
        HF_HOME: /tmp/hf
        TRANSFORMERS_CACHE: /tmp/hf/transformers
        HUGGINGFACE_HUB_CACHE: /tmp/hf/hub
Resources:
  DprEmbedFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /embed
            Method: POST
      ImageUri: dprembedfunction:latest
    Metadata:
      DockerContext: C:\Users\pw\projects\faas-rag\lambda\dpr-lambda
      DockerTag: latest
      Dockerfile: Dockerfile
      SamResourceId: DprEmbedFunction
Outputs:
  ApiUrl:
    Description: HTTP API endpoint
    Value:
      Fn::Sub: https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/embed
