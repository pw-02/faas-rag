AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: DPR question embedding (ONNX Runtime) on Lambda container

Globals:
  Function:
    Timeout: 60
    MemorySize: 4096
    Architectures:
      - x86_64
    Environment:
      Variables:
        MAX_LENGTH: "509"  # should match what was used during export
        MODEL_FILE: "model.onnx"
        HF_HOME: /tmp/hf
        TRANSFORMERS_CACHE: /tmp/hf/transformers
        HUGGINGFACE_HUB_CACHE: /tmp/hf/hub

Resources:
  DprEmbedFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image

      # # Optional but recommended for consistent low latency:
      # AutoPublishAlias: live
      # ProvisionedConcurrencyConfig:
      #   ProvisionedConcurrentExecutions: 2

      # Optional safety valve: cap scaling to protect downstream + cost
      # ReservedConcurrentExecutions: 20

      # Example HTTP endpoint (optional)
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /embed
            Method: POST

    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: latest

Outputs:
  ApiUrl:
    Description: "HTTP API endpoint"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/embed"
